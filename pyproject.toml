[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-game-vault-importer"
version = "0.4.0"
description = "GUI and CLI importer for already decoupled Windows games, saves, documentation and supplemental content into OfflineGameVault"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "offline-game-vault contributors"}]
dependencies = []

[project.scripts]
ogv-import = "offline_game_vault_importer.cli:main"
ogv-import-gui = "offline_game_vault_importer.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
